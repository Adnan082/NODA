# K=5, seeds {0,1,2,3,7} -- not the originally-planned 8. Day 5's retrain (higher
# early_stop_patience, faster GPUs, live log syncing) trained 7 new seeds (1-7);
# verified via the full-test-set one-step correlation-vs-persistence check
# (same diagnostic that caught the first broken seed 4): seeds 1, 2, 3, 7 are
# genuinely working (correlation 0.21-0.26, clearly beat a persistence baseline),
# but seeds 4, 5, 6 converged to a collapsed "predict near-zero-change" state
# (correlation ~0, WORSE than persistence) despite reasonable-looking training-time
# val_rollout_loss numbers -- a real, reportable finding that the 20-step rollout
# validation metric doesn't reliably expose this specific failure mode by itself.
# Proceeding with the 5 verified-working seeds rather than a further retraining round.
name: multisurrogate
num_models: 5
checkpoints:
  - ${paths.model_dir}/fno_seed0_best.eqx
  - ${paths.model_dir}/fno_seed1_best.eqx
  - ${paths.model_dir}/fno_seed2_best.eqx
  - ${paths.model_dir}/fno_seed3_best.eqx
  - ${paths.model_dir}/fno_seed7_best.eqx
member_assignment: round_robin

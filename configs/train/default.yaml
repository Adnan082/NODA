rollout_length: 4        # K: training unrolls the model this many autoregressive steps
val_rollout_length: 20   # validated on a LONGER rollout than trained on -- early-stop
                          # on rollout stability, not one-step accuracy (CLAUDE.md)
batch_size: 8
learning_rate: 1.0e-3
max_steps: 20000
val_every: 200
checkpoint_every: 500
early_stop_patience: 10  # consecutive non-improving validations before stopping
checkpoint_dir: ${paths.model_dir}

wandb:
  enabled: false          # flip on once a W&B account/API key is set up
  project: noda

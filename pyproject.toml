[project]
name = "noda"
version = "0.1.0"
description = "Measuring and correcting overconfidence in surrogate-driven EnKF"
requires-python = ">=3.11,<3.13"
dependencies = [
  "jax>=0.4.28,<0.5",
  "jaxlib>=0.4.28,<0.5",
  "jax-cfd>=0.2.0",
  "equinox>=0.11",
  "optax>=0.1.9,<0.2",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "jaxtyping>=0.2.28",
  "wandb>=0.17",
  "numpy>=1.26,<2.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noda"]
